<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none" role="img" aria-label="Logo LBBS">
  <!-- Organic Root/Soil Base -->
  <g class="lbbs-emblem" transform="translate(4, 2)">
    <!-- Soil bed / root nodes -->
    <path d="M12 42c6-3 14-4 22-4s16 1 22 4c-4 5-12 8-22 8s-18-3-22-8z" fill="#8b5a2b" opacity="0.85"/>
    <ellipse cx="26" cy="46" rx="4" ry="2" fill="#5c3818"/>
    <ellipse cx="36" cy="47" rx="3" ry="1.5" fill="#5c3818"/>
    <ellipse cx="44" cy="45" rx="3.5" ry="2" fill="#5c3818"/>
    
    <!-- Central Stem & Sprout -->
    <path d="M34 38V18" stroke="#a3d996" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Central Leaf -->
    <path d="M34 18c-3-8 1-14 0-16 6 1 9 8 0 16z" fill="#659A5A" stroke="#a3d996" stroke-width="1.5"/>
    
    <!-- Left Leaf -->
    <path d="M33 26c-8-4-15-2-19 2 5 5 13 4 19-2z" fill="#74a367" stroke="#a3d996" stroke-width="1.5"/>
    
    <!-- Right Leaf -->
    <path d="M35 24c8-4 15-2 19 2-5 5-13 4-19-2z" fill="#659A5A" stroke="#a3d996" stroke-width="1.5"/>
    
    <!-- Secondary Sproutlets -->
    <path d="M34 32c-6-3-11-1-14 2 4 3 10 2 14-2z" fill="#4a7c41" opacity="0.9"/>
    <path d="M34 30c6-3 11-1 14 2-4 3-10 2-14-2z" fill="#4a7c41" opacity="0.9"/>
  </g>

  <!-- Typography: LBBS Wordmark -->
  <g class="lbbs-wordmark" transform="translate(68, 41)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" letter-spacing="1.5" fill="#ffffff">LBBS</text>
  </g>
</svg>
